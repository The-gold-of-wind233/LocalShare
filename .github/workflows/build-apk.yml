name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不使用 android-actions/setup-android：它会执行 "sdkmanager tools"，
      # 而 cmdline-tools 16 已移除 tools 包，必然失败。
      # GitHub 运行器自带 Android SDK，这里只补装本项目需要的组件。
      - name: 3. 接受 SDK licenses
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          echo "licenses ok"

      - name: 4. 安装 Android 平台与构建工具
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 5. 下载 Gradle 8.0
        run: |
          set -e
          cd /tmp
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q -o gradle.zip -d /opt
          /opt/gradle-8.0/bin/gradle --version | head -3

      - name: 6. 编译 Debug APK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          /opt/gradle-8.0/bin/gradle assembleDebug --no-daemon

      - name: 7. 上传 APK（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
